<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Interim editorial illustration for the drinking water case study:
       water seen through a glass, with rising ozone bubbles. Decorative only; contains no data. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e9ee"/>
      <stop offset=".45" stop-color="#7fb0c2"/>
      <stop offset="1" stop-color="#1f5873"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e8f4f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#water)"/>
  <!-- surface -->
  <path d="M0 210 C 200 190, 400 232, 600 212 S 1000 188, 1200 210 S 1500 230, 1600 208 V 0 H 0 Z" fill="#f4f8f6"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M0 236 C 220 218, 420 256, 640 238 S 1040 214, 1260 236 S 1500 252, 1600 234" stroke-opacity=".55" stroke-width="3"/>
    <path d="M0 300 C 260 284, 470 318, 700 302 S 1100 282, 1320 300 S 1520 314, 1600 298" stroke-opacity=".28" stroke-width="2"/>
    <path d="M0 380 C 240 366, 480 396, 720 382 S 1140 364, 1360 380 S 1540 392, 1600 378" stroke-opacity=".16" stroke-width="2"/>
  </g>
  <!-- light shafts -->
  <g opacity=".5">
    <rect x="360" y="210" width="90" height="790" fill="url(#light)" transform="skewX(-8)"/>
    <rect x="820" y="210" width="150" height="790" fill="url(#light)" transform="skewX(-8)"/>
    <rect x="1240" y="210" width="70" height="790" fill="url(#light)" transform="skewX(-8)"/>
  </g>
  <!-- rising bubbles -->
  <g stroke="#ffffff" stroke-opacity=".7" stroke-width="2" fill="url(#bubble)">
    <circle cx="980" cy="860" r="34"/>
    <circle cx="1030" cy="740" r="22"/>
    <circle cx="960" cy="640" r="28"/>
    <circle cx="1012" cy="540" r="16"/>
    <circle cx="975" cy="452" r="20"/>
    <circle cx="1005" cy="372" r="11"/>
    <circle cx="990" cy="300" r="8"/>
    <circle cx="1120" cy="900" r="18"/>
    <circle cx="1150" cy="790" r="12"/>
    <circle cx="1105" cy="690" r="15"/>
    <circle cx="1140" cy="590" r="9"/>
    <circle cx="1118" cy="500" r="7"/>
    <circle cx="880" cy="920" r="14"/>
    <circle cx="905" cy="800" r="10"/>
    <circle cx="870" cy="700" r="12"/>
    <circle cx="890" cy="590" r="7"/>
    <circle cx="560" cy="880" r="10"/>
    <circle cx="590" cy="760" r="7"/>
    <circle cx="1320" cy="840" r="9"/>
    <circle cx="1300" cy="720" r="6"/>
  </g>
</svg>
